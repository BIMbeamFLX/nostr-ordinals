# Minimal strfry for the NORD prototype - the asset chains are small
# signed events from one known mint; nothing fancy needed. Full options:
# https://github.com/hoytech/strfry/blob/master/strfry.conf

db = "/app/strfry-db/"

relay {
    bind = "0.0.0.0"
    port = 7777
    nofiles = 0

    info {
        name = "NORD prototype relay"
        description = "Asset chains for the 600B NORD prototype - genesis, transfer, melt."
    }

    writePolicy {
        # open for the prototype; lock down to the mint's nostrPubkey
        # via a plugin before anything public-facing matters
        plugin = ""
    }
}
